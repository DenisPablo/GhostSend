services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostsend_backend
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - LocalStorage__BasePath=/app/uploads
      - FileSettings__MaxFileSizeInBytes=10737418240
    # No mapeamos puertos aquí si usarás el proxy de Coolify, 
    # pero para tu red local, puedes dejar el puerto 8080.
    ports:
      - "8080:8080"
    volumes:
      - ghostsend_uploads:/app/uploads
    restart: always

volumes:
  ghostsend_uploads:
