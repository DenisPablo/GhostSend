services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostsend_backend
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - CorsSettings__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      #Todo se lee desde las variables de entorno de Dokploy
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - MinioSettings__ServiceURL=${MINIO_SERVICE_URL}
      - MinioSettings__AccessKey=${MINIO_ACCESS_KEY}
      - MinioSettings__SecretKey=${MINIO_SECRET_KEY}
      - MinioSettings__BucketName=${MINIO_BUCKET_NAME}
      - MinioSettings__ForcePathStyle=true
      - FileSettings__MaxFileSizeInBytes=${MAX_FILE_SIZE}
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    ports:
      - "8080:8080"
    
    networks:
      - dokploy-network
    restart: always

networks:
  dokploy-network:
    external: true