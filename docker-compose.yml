services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostsend-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - FileSettings__UploadPath=/app/uploads
    volumes:
      - ghostsend_uploads:/app/uploads
    depends_on:
      - db
    # No mapeamos puertos aquí, Coolify lo hará por nosotros

  db:
    image: postgres:15-alpine
    container_name: ghostsend-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ghostsend_db_data:/var/lib/postgresql/data
    restart: always

volumes:
  ghostsend_uploads:
  ghostsend_db_data:
